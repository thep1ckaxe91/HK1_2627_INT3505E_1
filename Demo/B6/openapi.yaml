info:
  description: 'OpenAPI specification for Social Network Service Auth and Post Subsystems.

    Demonstrates Scope-based Access Control, BOLA prevention, and Token Lifecycles.'
  contact:
    email: dev@uet.vnu.edu.vn
  title: Social Network Service API
  version: v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Standard Bearer JWT header: ''Authorization: Bearer <token>'''
    OAuth2:
      type: oauth2
      description: OAuth 2.0 Authorization framework with scope delegation
      flows:
        password:
          tokenUrl: /auth/login
          scopes:
            posts:read: Read permissions for public and authorized posts
            posts:write: Create and modify posts
  schemas:
    Error:
      type: object
      properties:
        code:
          type: integer
          description: Error code
        status:
          type: string
          description: Error name
        message:
          type: string
          description: Error message
        errors:
          type: object
          description: Errors
          additionalProperties: {}
      additionalProperties: false
    PaginationMetadata:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items.
        total_pages:
          type: integer
          description: Total number of pages.
        first_page:
          type: integer
          description: First available page number.
        last_page:
          type: integer
          description: Last available page number.
        page:
          type: integer
          description: Current page number.
        previous_page:
          type: integer
          description: Previous page number.
        next_page:
          type: integer
          description: Next page number.
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: User email address
          example: student@vnu.edu.vn
        password:
          type: string
          writeOnly: true
          description: User plain text password
          example: SecretPass123!
      required:
      - email
      - password
      additionalProperties: false
    ValidationError:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 422
        status:
          type: string
          description: HTTP status text
          example: Unprocessable Entity
        errors:
          type: object
          description: Mapping of field names to validation failure reasons
          example:
            email:
            - Not a valid email address.
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
      - status
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP status code
          example: 401
        status:
          type: string
          description: HTTP status text
          example: Unauthorized
        message:
          type: string
          description: Descriptive human-readable error message
          example: Invalid credentials provided.
        error_type:
          type: string
          default: AUTHENTICATION_ERROR
          description: Domain-specific error code
          example: INVALID_CREDENTIALS
      required:
      - code
      - message
      - status
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Short-lived JWT Access Token (15 mins TTL)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: Long-lived JWT Refresh Token (30 days TTL)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          default: Bearer
          description: Token authorization type
          example: Bearer
        expires_in:
          type: integer
          default: 900
          description: Token lifetime in seconds
          example: 900
        scopes:
          type: array
          description: Granted authorization scopes
          example:
          - posts:read
          - posts:write
          items:
            type: string
      required:
      - access_token
      - refresh_token
      - scopes
      additionalProperties: false
    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Newly minted JWT Access Token (15 mins TTL)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          default: Bearer
          description: Token authorization type
          example: Bearer
        expires_in:
          type: integer
          default: 900
          description: Token lifetime in seconds
          example: 900
      required:
      - access_token
      additionalProperties: false
    PostResponse:
      type: object
      properties:
        id:
          type: integer
          description: Unique post ID
          example: 1
        author_id:
          type: string
          description: User ID of the post author
          example: '1'
        title:
          type: string
          description: Post title
          example: High Performance Low-Latency Networking in C++
        content:
          type: string
          description: Post text body
          example: Exploring epoll, io_uring, and lock-free ring buffers.
        is_private:
          type: boolean
          description: Whether the post is private to the author
          example: false
        created_at:
          type: string
          description: Creation timestamp in ISO-8601 format
          example: '2026-10-27T00:00:00Z'
      required:
      - author_id
      - content
      - created_at
      - id
      - is_private
      - title
      additionalProperties: false
  responses:
    DEFAULT_ERROR:
      description: Default error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /auth/login:
    post:
      responses:
        '422':
          description: Input validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          description: Too many requests. Rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication failed. Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Malformed JSON request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Login successful. Returns access and refresh JWT tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      tags:
      - auth
      summary: User Login
      description: "### Specification Details\n- **Scope Required**: `None` (Public\
        \ authentication boundary).\n- **Potential Errors**:\n  - `400 Bad Request`:\
        \ Malformed JSON or unparseable payload.\n  - `401 Unauthorized`: Invalid\
        \ credentials (fail-closed, constant-time compare to mitigate user enumeration).\n\
        \  - `422 Unprocessable Entity`: Schema validation failure (missing required\
        \ fields or malformed email format).\n  - `429 Too Many Requests`: Triggered\
        \ when credential stuffing or brute-force threshold is exceeded.\n- **Status\
        \ Codes**:\n  - `200 OK`: Successful authentication returning short-lived\
        \ access JWT and long-lived refresh JWT.\n  - `400`, `401`, `422`, `429`."
      security: []
  /auth/refresh:
    post:
      responses:
        '422':
          description: Malformed authorization header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Revoked token or insufficient refresh scope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid, or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      tags:
      - auth
      summary: Refresh Access Token
      description: "### Specification Details\n- **Scope Required**: `auth:refresh`\
        \ (Dedicated Refresh Token required; Access Tokens will be rejected).\n- **Potential\
        \ Errors**:\n  - `401 Unauthorized`: Missing Bearer header, expired token,\
        \ or signature verification failure.\n  - `403 Forbidden`: Token has been\
        \ revoked in blocklist or does not contain `auth:refresh` scope.\n  - `422\
        \ Unprocessable Entity`: Malformed token structure or unparseable Bearer format.\n\
        - **Status Codes**:\n  - `200 OK`: Newly issued access token.\n  - `401`,\
        \ `403`, `422`."
      security:
      - BearerAuth: []
  /posts/{id}:
    get:
      responses:
        '422':
          description: Validation error on post ID parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Post not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden. Insufficient scope ('posts:read') or BOLA violation
            on private post.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Post retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        default:
          $ref: '#/components/responses/DEFAULT_ERROR'
      tags:
      - posts
      summary: Get Post by ID
      description: "### Specification Details\n- **Scope Required**: `posts:read`\
        \ (Bearer access token containing `posts:read` scope).\n- **Potential Errors**:\n\
        \  - `401 Unauthorized`: Missing, expired, or signature-invalid Bearer token.\n\
        \  - `403 Forbidden`: Token lacks `posts:read` scope OR caller fails object-level\
        \ ownership check (BOLA / OWASP API1:2023) on private post.\n  - `404 Not\
        \ Found`: Post with requested ID does not exist.\n  - `422 Unprocessable Entity`:\
        \ Invalid post ID format.\n- **Status Codes**:\n  - `200 OK`: Post metadata\
        \ and body.\n  - `401`, `403`, `404`, `422`."
      security:
      - BearerAuth: []
      - OAuth2:
        - posts:read
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 0
tags:
- name: auth
  description: Authentication operations
- name: posts
  description: Post management operations
openapi: 3.0.3
