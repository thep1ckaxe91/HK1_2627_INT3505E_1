openapi: 3.0.3
info:
  version: "1.0.0"
  title: products-api
  description: "Product CRUD and Stock Reservation Specification"
security: []
paths:
  /products:
    get:
      operationId: product_api.api.products.list_products
      summary: "Get paginated list of non-archived products"
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          description: "Paginated list of products"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          description: "Invalid query parameter values"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: product_api.api.products.create_product
      summary: "Create a new product"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductIn"
      responses:
        "201":
          description: "Product created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "409":
          description: "SKU already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: product_api.api.products.get_product
      summary: "Get product details by ID"
      responses:
        "200":
          description: "Product found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "404":
          description: "Product not found or archived"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: product_api.api.products.patch_product
      summary: "Partially update product fields"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: "Product updated successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "404":
          description: "Product not found or archived"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: product_api.api.products.delete_product
      summary: "Soft delete product by ID (set archived = true)"
      responses:
        "204":
          description: "Product archived successfully"
        "404":
          description: "Product not found or already archived"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/reserve:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: product_api.api.products.reserve_product
      summary: "Atomically decrement stock quantity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveIn"
      responses:
        "200":
          description: "Stock successfully reserved"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOut"
        "404":
          description: "Product not found or archived"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Out of stock / Insufficient quantity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error (e.g. qty < 1)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    id:
      required: true
      name: id
      in: path
      description: "Numeric product primary key"
      schema:
        type: integer
        format: int32
    PageQuery:
      name: page
      in: query
      required: false
      description: "1-based page number"
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    SizeQuery:
      name: size
      in: query
      required: false
      description: "Page size"
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - detail
      properties:
        error:
          type: string
          description: "Machine readable error code"
          example: "conflict"
        detail:
          type: string
          description: "Human readable error detail"
          example: "sku already exists"

    ProductOut:
      type: object
      required:
        - id
        - sku
        - name
        - price_cents
        - qty_in_stock
        - archived
      properties:
        id:
          type: integer
          example: 1
        sku:
          type: string
          example: "PROD-101"
        name:
          type: string
          example: "Mechanical Keyboard"
        description:
          type: string
          nullable: true
          example: "Tactile brown switches"
        price_cents:
          type: integer
          example: 9999
        qty_in_stock:
          type: integer
          example: 50
        archived:
          type: boolean
          example: false

    ProductPage:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductOut"
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1

    ProductIn:
      type: object
      required:
        - sku
        - name
        - price_cents
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[A-Za-z0-9-_]+$"
          example: "PROD-101"
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Mechanical Keyboard"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Tactile brown switches"
        price_cents:
          type: integer
          minimum: 0
          example: 9999
        qty_in_stock:
          type: integer
          minimum: 0
          default: 0
          example: 50

    ProductPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Mechanical Keyboard V2"
        description:
          type: string
          nullable: true
          maxLength: 2000
        price_cents:
          type: integer
          minimum: 0
          example: 8999

    ReserveIn:
      type: object
      required:
        - qty
      properties:
        qty:
          type: integer
          minimum: 1
          example: 2
