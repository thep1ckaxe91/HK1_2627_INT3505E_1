openapi: 3.0.3
info:
  version: "1.0.0"
  title: orders-api
  description: "Orders and OrderItems specification with relational eager loading"
security: []

paths:
  /orders:
    get:
      operationId: product_api.api.orders.list_orders
      summary: "Get paginated list of orders with eager-loaded items"
      parameters:
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/SizeQuery"
      responses:
        "200":
          description: "Paginated list of orders"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          description: "Invalid query parameters"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: product_api.api.orders.create_order
      summary: "Create a new order containing one or more order items"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderIn"
      responses:
        "201":
          description: "Order placed successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOut"
        "404":
          description: "Product ID in items does not exist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "Insufficient stock for one or more items"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: product_api.api.orders.get_order
      summary: "Get order details by ID"
      responses:
        "200":
          description: "Order found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderOut"
        "404":
          description: "Order not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    id:
      required: true
      name: id
      in: path
      description: "Numeric order primary key"
      schema:
        type: integer
        format: int32
    PageQuery:
      name: page
      in: query
      required: false
      description: "1-based page number"
      schema:
        type: integer
        format: int32
        default: 1
        minimum: 1
    SizeQuery:
      name: size
      in: query
      required: false
      description: "Page size"
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - detail
      properties:
        error:
          type: string
          description: "Machine readable error code"
          example: "out_of_stock"
        detail:
          type: string
          description: "Human readable error detail"
          example: "insufficient stock for product 1"

    OrderItemIn:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          example: 1
        quantity:
          type: integer
          minimum: 1
          example: 2

    OrderItemOut:
      type: object
      required:
        - id
        - product_id
        - name
        - price_cents
        - quantity
      properties:
        id:
          type: integer
          example: 10
        product_id:
          type: integer
          example: 1
        name:
          type: string
          example: "Mechanical Keyboard"
        price_cents:
          type: integer
          example: 9999
        quantity:
          type: integer
          example: 2

    OrderIn:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemIn"

    OrderOut:
      type: object
      required:
        - id
        - items
        - total_price_cents
      properties:
        id:
          type: integer
          example: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemOut"
        total_price_cents:
          type: integer
          example: 19998

    OrderPage:
      type: object
      required:
        - items
        - page
        - size
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderOut"
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        total:
          type: integer
          example: 1
