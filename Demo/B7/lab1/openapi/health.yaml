components:
  schemas:
    ErrorResponse:
      properties:
        detail:
          description: Human readable error detail
          example: database unreachable
          type: string
        error:
          description: Machine readable error code
          example: service_unavailable
          type: string
      required:
      - error
      - detail
      type: object
    HealthProbe:
      properties:
        status:
          example: ok
          type: string
      required:
      - status
      type: object
    ReadinessProbe:
      properties:
        checks:
          properties:
            db:
              example: ok
              type: string
          type: object
        status:
          example: ok
          type: string
      required:
      - status
      - checks
      type: object
info:
  description: Liveness and Readiness Probes for Kubernetes / Docker orchestrator
  title: health-api
  version: 1.0.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: product_api.api.health.liveness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthProbe'
          description: Healthy
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unavailable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unavailable
      security: []
      summary: Liveness probe - checks if python event loop/process is alive
  /ready:
    get:
      operationId: product_api.api.health.readiness
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessProbe'
          description: Ready to serve traffic
        4XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service unavailable / Database down
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service unavailable / Database down
      security: []
      summary: Readiness probe - checks database connectivity
