upstream product_api_cluster {
    least_conn;
    server api:5000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client body limit
    client_max_body_size 10M;

    location / {
        proxy_pass http://product_api_cluster;

        # HTTP/1.1 and keepalive connection pooling
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Standard proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inject distributed request tracking ID correlated with application logger
        proxy_set_header X-Request-Id $request_id;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
