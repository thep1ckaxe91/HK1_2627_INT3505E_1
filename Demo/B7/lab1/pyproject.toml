[project]
name = "product-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "thep1ckaxe91", email = "ThePickaxe91@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "connexion[flask,swagger-ui,uvicorn]>=3.3.0",
    "flask>=3.1.3",
    "flask-migrate>=4.0.7",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "marshmallow>=3.22.0",
    "psycopg>=3.2.0",
    "pytest>=9.2.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.30.0",
]

[project.scripts]
lab1 = "lab1:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.2.0",
]
